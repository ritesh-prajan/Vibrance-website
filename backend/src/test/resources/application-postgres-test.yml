server:
  port: 8082

spring:
  application:
    name: vibrance-backend-postgres-test
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/vibrance_db}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
